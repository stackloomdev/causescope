<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">CauseScope</title>
  <desc id="description">Click any UI. Trace the cause.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1050 80) rotate(132) scale(620 550)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff385c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff385c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1120" cy="110" r="82" fill="#ff385c" fill-opacity=".12" filter="url(#blur)"/>

  <g transform="translate(76 70)">
    <circle cx="19" cy="19" r="18" fill="#17171b" stroke="#ffffff" stroke-opacity=".16"/>
    <path d="M18.4 9.5c-5.1 0-8.7 3.8-8.7 9.3 0 5.7 3.6 9.7 8.8 9.7 4 0 7.1-2.2 8.2-5.8h-5.1c-.6 1-1.6 1.5-3 1.5-2 0-3.4-1.2-3.8-3.4h12.4c.1-.7.1-1.3.1-1.9 0-5.5-3.6-9.4-8.9-9.4Zm-3.5 7.9c.5-2.2 1.8-3.4 3.6-3.4 1.9 0 3.1 1.2 3.5 3.4h-7.1Z" fill="#ff385c"/>
    <text x="52" y="28" fill="#f7f5f2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" font-weight="760" letter-spacing="-1.2">CauseScope</text>
    <g transform="translate(882 4)">
      <circle cx="7" cy="15" r="5" fill="#ff385c"/>
      <text x="25" y="20" fill="#ff385c" font-family="SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">LOCAL-FIRST</text>
    </g>
  </g>

  <g transform="translate(76 178)">
    <text y="0" fill="#ff385c" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">THE EVIDENCE CHAIN BEHIND ANY REACT UI</text>
    <text y="91" fill="#f7f5f2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="78" font-weight="780" letter-spacing="-5">Click any UI.</text>
    <text y="170" fill="#ff385c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="78" font-weight="780" letter-spacing="-5">Trace the cause.</text>
    <text y="225" fill="#aaa6a1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" letter-spacing="-.4">Exact TSX · live decisions · state · props · stores · network</text>
  </g>

  <g transform="translate(76 520)">
    <rect width="1128" height="1" fill="#ffffff" fill-opacity=".12"/>
    <g transform="translate(0 38)" font-family="SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5">
      <text fill="#ff385c">01 · UI</text>
      <path d="M88-4h100" stroke="#ff385c" stroke-opacity=".55"/>
      <text x="212" fill="#d8d4cf">02 · TSX</text>
      <path d="M316-4h100" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="440" fill="#d8d4cf">03 · DECISION</text>
      <path d="M582-4h100" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="706" fill="#d8d4cf">04 · ORIGIN</text>
      <text x="926" fill="#77737a">REACT 18–19 / VITE 5–8</text>
    </g>
  </g>
</svg>
