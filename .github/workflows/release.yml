name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm channel to move to the current repository version
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @causescope/example-vite-react-19 exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Validate release tag and select npm channel
        id: package
        working-directory: packages/causescope
        shell: bash
        run: |
          VERSION="$(pnpm pkg get version | tr -d '"')"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          fi

          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            PRERELEASE="true"
          else
            DIST_TAG="latest"
            PRERELEASE="false"
          fi

          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          if npm view "causescope@${{ steps.package.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish npm package
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/causescope
        run: npm publish --access public --tag "${{ steps.package.outputs.dist_tag }}"
      - name: Create GitHub prerelease
        if: steps.package.outputs.prerelease == 'true'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create stable GitHub release
        if: steps.package.outputs.prerelease == 'false'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}

  retag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify dispatch uses current main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Manual dist-tag changes must run from the current main commit." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0
      - name: Validate package and requested channel
        id: package
        working-directory: packages/causescope
        shell: bash
        env:
          REQUESTED_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          VERSION="$(npm pkg get version | tr -d '\"')"
          PUBLISHED_VERSION="$(npm view "causescope@${VERSION}" version --json | tr -d '\"')"
          if [[ "${PUBLISHED_VERSION}" != "${VERSION}" ]]; then
            echo "causescope@${VERSION} is not published." >&2
            exit 1
          fi

          case "${REQUESTED_DIST_TAG}" in
            latest|beta) ;;
            *)
              echo "Unsupported dist-tag: ${REQUESTED_DIST_TAG}" >&2
              exit 1
              ;;
          esac

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Promote npm dist-tag
        env:
          REQUESTED_DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: npm dist-tag add "causescope@${VERSION}" "${REQUESTED_DIST_TAG}"
      - name: Verify npm dist-tag
        shell: bash
        env:
          REQUESTED_DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          RESOLVED_VERSION="$(npm view "causescope@${REQUESTED_DIST_TAG}" version --json | tr -d '\"')"
          if [[ "${RESOLVED_VERSION}" != "${VERSION}" ]]; then
            echo "${REQUESTED_DIST_TAG} resolved to ${RESOLVED_VERSION}, expected ${VERSION}." >&2
            exit 1
          fi
