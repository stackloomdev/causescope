name: Bug report
description: Report a reproducible CauseScope problem.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Follow the [beta testing guide](https://stackloomdev.github.io/causescope/beta-testing) to reduce the case. Remove secrets, private source code, customer data, and unredacted traces before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Element selection and source location
        - Expressions and condition evidence
        - React state, props, or event provenance
        - Network or storage provenance
        - React Query or Zustand adapter
        - Packaging, compatibility, or production removal
        - Documentation or live lab
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the selected element, interaction, and evidence CauseScope showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What evidence did you expect?
      description: Name the source location, value, transition, or unavailable state that would be correct.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a public reproduction or provide concise TypeScript steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: CauseScope, React, Vite, React plugin, Node.js, package manager, browser, operating system
    validations:
      required: true
  - type: dropdown
    id: production
    attributes:
      label: Does production output contain CauseScope markers?
      options:
        - "No"
        - "Yes"
        - "Not checked"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I reproduced this on the latest CauseScope beta or stable release.
          required: true
        - label: I removed secrets, private source code, customer data, and unredacted traces from this report.
          required: true
