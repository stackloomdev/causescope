version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Scheduled major version updates need a dedicated compatibility PR because
      # this monorepo intentionally tests multiple React and Vite generations.
      # GitHub can still open a cross-major security PR; triage those against the
      # compatibility fixtures instead of merging them automatically.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Action major upgrades can change runtime or inputs and need an
      # intentional compatibility review instead of an automated PR.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
